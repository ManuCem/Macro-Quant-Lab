<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interest rates - Macro Quant Lab</title>
<style>
  /* Colours as tokens: light by default, dark when the viewer's system is dark */
  :root {
    color-scheme: light dark;
    --page: #f9f9f7;  --surface: #fcfcfb;  --ink: #0b0b0b;  --ink-2: #52514e;
    --border: #e1e0d9;  --hover: #c3c2b7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
            --border: #2c2c2a; --hover: #4a4a46; }
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }

  /* One centred column; the side padding keeps a gutter on phones */
  main { max-width: 760px; margin: 0 auto; padding: 40px 20px 40px; }

  .back { display: inline-block; margin-bottom: 28px; color: var(--ink-2);
          text-decoration: none; font-size: 15px; }
  .back:hover { color: var(--ink); text-decoration: underline; }

  h1 { font-size: 32px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.01em; }
  .lead { margin: 0 0 40px; color: var(--ink-2); max-width: 56ch; }

  /* Cards: two columns on wide screens, stacked on narrow ones */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .card { display: flex; flex-direction: column; gap: 6px; padding: 20px 20px 18px;
          background: var(--surface); border: 1px solid var(--border);
          border-top: 4px solid var(--accent); border-radius: 8px;
          color: inherit; text-decoration: none;
          transition: border-color .15s, transform .15s; }
  .card:hover { border-color: var(--hover); border-top-color: var(--accent); transform: translateY(-2px); }
  .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .card h2 { font-size: 20px; margin: 0; }
  .card p { margin: 0; color: var(--ink-2); font-size: 15px; }
  .card .go { margin-top: auto; padding-top: 14px; font-weight: 600; color: var(--ink); }
  .card:hover .go span { display: inline-block; transform: translateX(4px); }
  .go span { transition: transform .15s; }
</style>
</head>
<body>
<main>
  <!-- ../index.html = the home page, one folder up -->
  <a class="back" href="../index.html">&larr; Macro Quant Lab</a>

  <h1>Interest rates</h1>
  <p class="lead">Policy rates set by the two biggest central banks. Choose one.</p>

  <nav class="cards" aria-label="Central banks">
    <!-- ecb_rates.html and fed_rates.html sit in this same folder -->
    <a class="card" href="ecb_rates.html" style="--accent:#2a78d6">
      <h2>ECB</h2>
      <p>European Central Bank: the key interest rates.</p>
      <span class="go">Open ECB rates <span aria-hidden="true">&rarr;</span></span>
    </a>

    <a class="card" href="fed_rates.html" style="--accent:#1baf7a">
      <h2>Federal Reserve</h2>
      <p>US Federal Reserve: the federal funds target rate.</p>
      <span class="go">Open Fed rates <span aria-hidden="true">&rarr;</span></span>
    </a>
  </nav>
</main>
</body>
</html>
