<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECB – Key Interest Rates</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #0f172a; color: #e2e8f0; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  p  { margin: 0 0 16px; color: #94a3b8; font-size: 14px; }
  .card { background: #1e293b; border-radius: 12px; padding: 16px; max-width: 1100px; }
  #chart { height: 520px; width: 100%; }
</style>
<!-- Apache ECharts, stored locally in lib/ so the page works offline -->
<script src="lib/echarts.js"></script>
</head>
<body>
<h1>ECB – Key Interest Rates</h1>
<p>Deposit facility, main refinancing (MRO) and marginal lending rates, 1999 – Oct 2026. Scroll to zoom, hover to compare. Next decision: 29 Oct 2026.</p>
<div class="card"><div id="chart"></div></div>
<script>
// [date effective, deposit facility %, MRO %, marginal lending %]
const rows = [["1999-01-01", 2.0, 3.0, 4.5], ["1999-01-04", 2.75, 3.0, 3.25], ["1999-04-09", 1.5, 2.5, 3.5], ["1999-11-05", 2.0, 3.0, 4.0], ["2000-02-04", 2.25, 3.25, 4.25], ["2000-03-17", 2.5, 3.5, 4.5], ["2000-04-28", 2.75, 3.75, 4.75], ["2000-06-09", 3.25, 4.25, 5.25], ["2000-09-01", 3.5, 4.5, 5.5], ["2000-10-06", 3.75, 4.75, 5.75], ["2001-05-11", 3.5, 4.5, 5.5], ["2001-08-31", 3.25, 4.25, 5.25], ["2001-09-18", 2.75, 3.75, 4.75], ["2001-11-09", 2.25, 3.25, 4.25], ["2002-12-06", 1.75, 2.75, 3.75], ["2003-03-07", 1.5, 2.5, 3.5], ["2003-06-06", 1.0, 2.0, 3.0], ["2005-12-06", 1.25, 2.25, 3.25], ["2006-03-08", 1.5, 2.5, 3.5], ["2006-06-15", 1.75, 2.75, 3.75], ["2006-08-09", 2.0, 3.0, 4.0], ["2006-10-11", 2.25, 3.25, 4.25], ["2006-12-13", 2.5, 3.5, 4.5], ["2007-03-14", 2.75, 3.75, 4.75], ["2007-06-13", 3.0, 4.0, 5.0], ["2008-07-09", 3.25, 4.25, 5.25], ["2008-10-08", 3.75, 4.25, 4.75], ["2008-10-15", 3.25, 3.75, 4.25], ["2008-11-12", 2.75, 3.25, 3.75], ["2008-12-10", 2.0, 2.5, 3.0], ["2009-01-21", 1.0, 2.0, 3.0], ["2009-03-11", 0.5, 1.5, 2.5], ["2009-04-08", 0.25, 1.25, 2.25], ["2009-05-13", 0.25, 1.0, 1.75], ["2011-04-13", 0.5, 1.25, 2.0], ["2011-07-13", 0.75, 1.5, 2.25], ["2011-11-09", 0.5, 1.25, 2.0], ["2011-12-14", 0.25, 1.0, 1.75], ["2012-07-11", 0.0, 0.75, 1.5], ["2013-05-08", 0.0, 0.5, 1.0], ["2013-11-13", 0.0, 0.25, 0.75], ["2014-06-11", -0.1, 0.15, 0.4], ["2014-09-10", -0.2, 0.05, 0.3], ["2015-12-09", -0.3, 0.05, 0.3], ["2016-03-16", -0.4, 0.0, 0.25], ["2019-09-18", -0.5, 0.0, 0.25], ["2022-07-27", 0.0, 0.5, 0.75], ["2022-09-14", 0.75, 1.25, 1.5], ["2022-11-02", 1.5, 2.0, 2.25], ["2022-12-21", 2.0, 2.5, 2.75], ["2023-02-08", 2.5, 3.0, 3.25], ["2023-03-22", 3.0, 3.5, 3.75], ["2023-05-10", 3.25, 3.75, 4.0], ["2023-06-21", 3.5, 4.0, 4.25], ["2023-08-02", 3.75, 4.25, 4.5], ["2023-09-20", 4.0, 4.5, 4.75], ["2024-06-12", 3.75, 4.25, 4.5], ["2024-09-18", 3.5, 3.65, 3.9], ["2024-10-23", 3.25, 3.4, 3.65], ["2024-12-18", 3.0, 3.15, 3.4], ["2025-02-05", 2.75, 2.9, 3.15], ["2025-03-12", 2.5, 2.65, 2.9], ["2025-04-23", 2.25, 2.4, 2.65], ["2025-06-11", 2.0, 2.15, 2.4], ["2026-06-17", 2.25, 2.4, 2.65], ["2026-09-16", 2.5, 2.65, 2.9]];
const END_DATE = "2026-10-03";
const col = i => rows.map(r => [r[0], r[i]]);   // pick one rate column

// Build one ECharts line series from [[date, value], ...] pairs
const makeSeries = (name, color, pts) => ({
  name, type: "line",
  step: "end",              // hold the old rate flat, then jump on the decision date
  showSymbol: false,        // no dots, the step shape is enough
  lineStyle: { color, width: 2.5 }, itemStyle: { color },
  data: [...pts, [END_DATE, pts[pts.length - 1][1]]]   // extend the last rate to "today"
});

const chart = echarts.init(document.getElementById("chart"), "dark");   // "dark" built-in theme
chart.setOption({
  backgroundColor: "transparent",
  tooltip: { trigger: "axis", valueFormatter: v => v.toFixed(2) + "%" },  // one tooltip comparing all series
  legend: { top: 0 },
  grid: { left: 55, right: 20, top: 40, bottom: 80 },
  xAxis: { type: "time" },
  yAxis: { type: "value", axisLabel: { formatter: "{value}%" }, splitLine: { lineStyle: { color: "#334155" } } },
  dataZoom: [{ type: "inside" }, { type: "slider" }],                     // mouse-wheel zoom + bottom slider
  toolbox: { feature: { saveAsImage: {}, dataZoom: {} } },                // export PNG / box zoom
  series: [
    makeSeries("Deposit facility",       "#38bdf8", col(1)),
    makeSeries("Main refinancing (MRO)", "#34d399", col(2)),
    makeSeries("Marginal lending",       "#f59e0b", col(3))
  ]
});
addEventListener("resize", () => chart.resize());   // keep the chart fitted when the window changes

</script>
</body>
</html>
